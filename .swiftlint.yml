disabled_rules:
  - trailing_whitespace
opt_in_rules:
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
line_length:
  warning: 140
  error: 180
function_body_length:
  warning: 80
  error: 120
type_body_length:
  warning: 350
  error: 500
file_length:
  warning: 600
  error: 1000
cyclomatic_complexity:
  warning: 15
  error: 25
excluded:
  - .build
  - Pods
  - Resources/ImageMagickDistribution
